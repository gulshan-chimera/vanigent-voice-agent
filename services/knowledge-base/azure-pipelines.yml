trigger:
  branches:
    include:
      - main
      - dev
  paths:
    include:
      - services/knowledge-base/*

pr:
  branches:
    include:
      - main
      - dev
  paths:
    include:
      - services/knowledge-base/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '22.x'
  azureSubscription: 'AzureServiceConnection-Vanigent'
  appName: 'VanigentAI-DEV'

stages:
  - stage: Build_And_Test
    displayName: 'Build Knowledge Base'
    jobs:
      - job: Build
        displayName: 'Build KB'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '$(nodeVersion)'
            displayName: 'Install Node.js'

          - script: |
              npm ci
              npm run build
            workingDirectory: 'services/knowledge-base'
            displayName: 'Install and Build'

          - script: |
              npm prune --production
            workingDirectory: 'services/knowledge-base'
            displayName: 'Prune dev dependencies'

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: 'services/knowledge-base'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/knowledge-base-$(Build.BuildId).zip'
              replaceExistingArchive: true
            displayName: 'Zip Artifact'

          - publish: $(Build.ArtifactStagingDirectory)/knowledge-base-$(Build.BuildId).zip
            artifact: knowledge-base-artifact
            displayName: 'Publish Artifact'

  # -------------------------------------------------------------------------
  # DEPLOYMENT STAGE (Enabled)
  # -------------------------------------------------------------------------
  - stage: Deploy
    displayName: 'Deploy to Azure App Service'
    dependsOn: Build_And_Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Deploy_KnowledgeBase
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: knowledge-base-artifact
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appType: 'webAppLinux'
                    appName: '$(appName)'
                    package: '$(Pipeline.Workspace)/knowledge-base-artifact/knowledge-base-$(Build.BuildId).zip'
                    runtimeStack: 'NODE|22-lts'
                    startUpCommand: 'npm run start'
