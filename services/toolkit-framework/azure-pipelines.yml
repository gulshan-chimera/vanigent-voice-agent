trigger:
  branches:
    include:
      - main
      - dev
  paths:
    include:
      - services/toolkit-framework/*

pr:
  branches:
    include:
      - main
      - dev
  paths:
    include:
      - services/toolkit-framework/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '22.x'
  azureSubscription: 'Your-Azure-Service-Connection-Name'
  appName: 'vanigent-toolkit-app'

stages:
  - stage: Build_And_Test
    displayName: 'Build and Test Toolkit Framework'
    jobs:
      - job: Build
        displayName: 'Build & Test Toolkit'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '$(nodeVersion)'
            displayName: 'Install Node.js'

          - script: |
              npm ci
              npm run build
              npm run test
            workingDirectory: 'services/toolkit-framework'
            displayName: 'Install, Build, and Test'

          - script: |
              npm prune --production
            workingDirectory: 'services/toolkit-framework'
            displayName: 'Prune dev dependencies'

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: 'services/toolkit-framework'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/toolkit-framework-$(Build.BuildId).zip'
              replaceExistingArchive: true
            displayName: 'Zip Artifact'

          - publish: $(Build.ArtifactStagingDirectory)/toolkit-framework-$(Build.BuildId).zip
            artifact: toolkit-framework-artifact
            displayName: 'Publish Artifact'

